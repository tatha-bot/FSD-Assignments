<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q14: React JS Image Gallery</title>
  <!-- React & Babel CDNs for instant execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b1120;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }
    .gallery-container { width: 100%; max-width: 820px; }
    .gallery-header { text-align: center; margin-bottom: 24px; }
    .gallery-header h2 { color: #38bdf8; font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
    .gallery-header .subtitle { color: #94a3b8; font-size: 0.95rem; }
    .main-display-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }
    .image-viewport {
      position: relative;
      width: 100%;
      height: 420px;
      background: #020617;
      overflow: hidden;
    }
    .featured-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.7);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .nav-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      transform: translateY(-50%) scale(1.08);
    }
    .prev-btn { left: 16px; }
    .next-btn { right: 16px; }
    .counter-pill {
      position: absolute;
      bottom: 14px;
      right: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #f8fafc;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .image-info { padding: 20px 24px; }
    .category-tag {
      display: inline-block;
      background: #0369a1;
      color: #e0f2fe;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .image-title { color: #ffffff; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .image-description { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .thumbnails-wrapper h4 { color: #cbd5e1; font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
    .thumbnails-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .thumbnail-card {
      background: #1e293b;
      border: 2px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .thumbnail-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }
    .thumbnail-card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .thumbnail-card.active {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }
    .thumbnail-caption {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
    }
    .thumb-num { font-size: 0.75rem; font-weight: 800; color: #38bdf8; }
    .thumb-title {
      font-size: 0.8rem;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const galleryImages = [
      {
        id: 1,
        title: "Mountain Alpine Lake",
        category: "Landscape & Nature",
        description: "Serene glacial lake reflecting snow-capped peaks in the early morning sunrise.",
        src: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80",
        alt: "Scenic mountain lake"
      },
      {
        id: 2,
        title: "Dense Evergreen Rainforest",
        category: "Forest & Wilderness",
        description: "Lush misty canopy in the temperate Pacific Northwest rainforest showing rich biodiversity.",
        src: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80",
        alt: "Misty forest path"
      },
      {
        id: 3,
        title: "Golden Desert Dunes",
        category: "Arid & Desert",
        description: "Wind-sculpted sand dunes glowing under warm golden hour sunlight in the desert.",
        src: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1200&q=80",
        alt: "Desert sand dunes"
      }
    ];

    function App() {
      const [currentIndex, setCurrentIndex] = useState(0);

      const handlePrev = () => {
        setCurrentIndex((prev) => (prev === 0 ? galleryImages.length - 1 : prev - 1));
      };

      const handleNext = () => {
        setCurrentIndex((prev) => (prev === galleryImages.length - 1 ? 0 : prev + 1));
      };

      const currentImage = galleryImages[currentIndex];

      return (
        <div className="gallery-container">
          <header className="gallery-header">
            <h2>React Image Gallery</h2>
            <p className="subtitle">Assignment Q14 - Three Images Gallery Component</p>
          </header>

          <div className="main-display-card">
            <div className="image-viewport">
              <img
                src={currentImage.src}
                alt={currentImage.alt}
                className="featured-image"
              />
              <button className="nav-btn prev-btn" onClick={handlePrev} aria-label="Previous Image">
                &#10094;
              </button>
              <button className="nav-btn next-btn" onClick={handleNext} aria-label="Next Image">
                &#10095;
              </button>
              <div className="counter-pill">
                Image {currentIndex + 1} of {galleryImages.length}
              </div>
            </div>

            <div className="image-info">
              <span className="category-tag">{currentImage.category}</span>
              <h3 className="image-title">{currentImage.title}</h3>
              <p className="image-description">{currentImage.description}</p>
            </div>
          </div>

          <div className="thumbnails-wrapper">
            <h4>Select an Image:</h4>
            <div className="thumbnails-grid">
              {galleryImages.map((img, index) => (
                <div
                  key={img.id}
                  className={`thumbnail-card ${index === currentIndex ? 'active' : ''}`}
                  onClick={() => setCurrentIndex(index)}
                >
                  <img src={img.src} alt={img.alt} />
                  <div className="thumbnail-caption">
                    <span className="thumb-num">0{index + 1}</span>
                    <span className="thumb-title">{img.title}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
