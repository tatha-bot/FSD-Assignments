<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q15: React JS Greeting Application</title>
  <!-- React & Babel CDNs for instant execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    .greeting-app-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      transition: background 0.5s ease;
    }
    .theme-morning { background: radial-gradient(circle at 50% 20%, #451a03, #0f172a 80%); }
    .theme-afternoon { background: radial-gradient(circle at 50% 20%, #0c4a6e, #0f172a 80%); }
    .theme-evening { background: radial-gradient(circle at 50% 20%, #3b0764, #0f172a 80%); }
    .theme-night { background: radial-gradient(circle at 50% 20%, #172554, #020617 80%); }

    .greeting-card {
      width: 100%;
      max-width: 620px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      color: #f8fafc;
    }
    .header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .period-pill {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #10b981;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .greeting-hero { text-align: center; margin-bottom: 28px; }
    .greeting-icon { font-size: 3.5rem; margin-bottom: 8px; }
    .greeting-text {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .greeting-quote {
      color: #94a3b8;
      font-size: 0.95rem;
      font-style: italic;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }
    .clock-container {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 28px;
    }
    .time-display {
      font-size: 2.8rem;
      font-weight: 800;
      font-family: monospace;
      color: #ffffff;
      letter-spacing: 2px;
    }
    .date-display {
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 4px;
    }
    .settings-panel {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 20px;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .name-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .name-input:focus { border-color: #38bdf8; }
    .simulator-group { margin-top: 18px; }
    .simulator-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .preset-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .preset-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preset-btn:hover { background: #334155; color: #ffffff; }
    .preset-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .btn-reset {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .btn-reset:hover { background: #ef4444; color: #ffffff; }
    @media (max-width: 520px) {
      .greeting-card { padding: 24px 18px; }
      .greeting-text { font-size: 1.7rem; }
      .time-display { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentTime, setCurrentTime] = useState(new Date());
      const [userName, setUserName] = useState('Tathagata');
      const [simulatedHour, setSimulatedHour] = useState(null);

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const currentHour = simulatedHour !== null ? simulatedHour : currentTime.getHours();

      const getGreetingData = (hour) => {
        if (hour >= 5 && hour < 12) {
          return {
            greeting: 'Good Morning',
            icon: '🌅',
            timePeriod: 'Morning (05:00 - 11:59)',
            themeClass: 'theme-morning',
            color: '#f59e0b',
            quote: 'Start your day with positive energy, focus, and determination.'
          };
        } else if (hour >= 12 && hour < 17) {
          return {
            greeting: 'Good Afternoon',
            icon: '☀️',
            timePeriod: 'Afternoon (12:00 - 16:59)',
            themeClass: 'theme-afternoon',
            color: '#0284c7',
            quote: 'Keep up the momentum. You are halfway through achieving your goals today.'
          };
        } else if (hour >= 17 && hour < 21) {
          return {
            greeting: 'Good Evening',
            icon: '🌆',
            timePeriod: 'Evening (17:00 - 20:59)',
            themeClass: 'theme-evening',
            color: '#8b5cf6',
            quote: 'Reflect on today\'s achievements, unwind, and prepare for tomorrow.'
          };
        } else {
          return {
            greeting: 'Good Night',
            icon: '🌙',
            timePeriod: 'Night (21:00 - 04:59)',
            themeClass: 'theme-night',
            color: '#38bdf8',
            quote: 'Rest well and recharge. Tomorrow brings a fresh opportunity to excel.'
          };
        }
      };

      const greetingInfo = getGreetingData(currentHour);

      const formatTime = (date) => {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };

      const formatDate = (date) => {
        return date.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      };

      return (
        <div className={`greeting-app-wrapper ${greetingInfo.themeClass}`}>
          <div className="greeting-card">
            <div className="header-meta">
              <span className="period-pill">{greetingInfo.timePeriod}</span>
              <span className="live-badge">
                <span className="live-dot"></span> Live Clock
              </span>
            </div>

            <div className="greeting-hero">
              <div className="greeting-icon">{greetingInfo.icon}</div>
              <h1 className="greeting-text" style={{ color: greetingInfo.color }}>
                {greetingInfo.greeting}, {userName || 'Friend'}!
              </h1>
              <p className="greeting-quote">"{greetingInfo.quote}"</p>
            </div>

            <div className="clock-container">
              <div className="time-display">{formatTime(currentTime)}</div>
              <div className="date-display">{formatDate(currentTime)}</div>
            </div>

            <div className="settings-panel">
              <div className="input-group">
                <label>Personalize Name:</label>
                <input
                  type="text"
                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}
                  placeholder="Enter your name..."
                  className="name-input"
                />
              </div>

              <div className="simulator-group">
                <label>Test Other Time Slots (Preview Mode):</label>
                <div className="preset-buttons">
                  <button
                    className={`preset-btn ${currentHour === 8 && simulatedHour !== null ? 'active' : ''}`}
                    onClick={() => setSimulatedHour(8)}
                  >
                    🌅 Morning (8 AM)
                  </button>
                  <button
                    className={`preset-btn ${currentHour === 14 && simulatedHour !== null ? 'active' : ''}`}
                    onClick={() => setSimulatedHour(14)}
                  >
                    ☀️ Afternoon (2 PM)
                  </button>
                  <button
                    className={`preset-btn ${currentHour === 18 && simulatedHour !== null ? 'active' : ''}`}
                    onClick={() => setSimulatedHour(18)}
                  >
                    🌆 Evening (6 PM)
                  </button>
                  <button
                    className={`preset-btn ${currentHour === 23 && simulatedHour !== null ? 'active' : ''}`}
                    onClick={() => setSimulatedHour(23)}
                  >
                    🌙 Night (11 PM)
                  </button>
                  {simulatedHour !== null && (
                    <button
                      className="preset-btn btn-reset"
                      onClick={() => setSimulatedHour(null)}
                    >
                      &#8635; Real System Time
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
